name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    # pinned: windows-latest (Server 2025 image) breaks Flutter 3.35's VS
    # detection — it falls back to the VS2019 generator which doesn't exist
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Pack portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ver = python scripts/release-version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/lanchat-win-x64-$ver.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python scripts/release-version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/lanchat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Older clients require this exact asset name for in-app updates.
          Copy-Item "dist/lanchat-setup-$ver.exe" dist/lanchat-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android signature verification
        run: python3 test/android_signature_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify fixed Android release signature
        run: python3 scripts/verify-android-signature.py
      - run: |
          mkdir -p dist
          ver="$(python3 scripts/release-version.py)"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/lanchat-android-$ver.apk"
          # Compatibility asset for clients that only recognize the old name.
          cp "dist/lanchat-android-$ver.apk" dist/lanchat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  build-macos:
    # Keep Flutter 3.35 compatible with the original macOS 10.15 deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - name: Check first-launch installation hint
        run: test/macos_install_hint/run.sh
      - name: Test Mac update replacement and rollback
        run: python3 test/macos_updater_test.py
      - run: flutter build macos --release
      - name: Package DMG and ZIP
        run: |
          scripts/package-macos-release.sh
          ver="$(python3 scripts/release-version.py)"
          # Compatibility asset for clients that only recognize the old name.
          cp "dist/lanchat-macos-$ver.dmg" dist/lanchat-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            图片消息的右键菜单新增“复制图片”，发送和接收的图片均可复制图片内容，粘贴到其他应用。

            新增共享文件夹：聊天顶部可选择本机文件夹共享给当前设备，对方点击聊天卡片即可浏览、复制或保存。
            默认只读，可单独允许写入或取消共享，设置在重启后保留；双方均需使用支持此功能的版本并在线。
            支持整文件夹递归复制、上传、粘贴和桌面拖入，保留子目录及空文件夹；右上角菜单可直接复制整个当前文件夹。
            同名文件夹整体改名为“名称 (1)”，保留原内容；文件校验通过后再放入目标位置，取消、断线或校验失败时清理未完成目录。
            符号链接会跳过并提示数量；单文件须小于 4 GiB，一次递归传输最多 10000 项、64 层。

            更新弹窗支持勾选“此版本不再提示更新”；只忽略所选版本的自动弹窗，后续新版本仍会提醒，手动检查不受影响。
            安装包及便携包文件名包含版本号，网页下载时请选择带版本号的文件。
            不带版本号的安装包为旧客户端应用内更新的兼容入口，内容相同。

            macOS 推荐下载 lanchat-macos-1.0.15.dmg，打开后将应用拖入 Applications（应用程序）再启动。
            同时提供 Mac ZIP 和 SHA256SUMS-1.0.15.txt 校验清单。
            Windows 安装包为 lanchat-setup-1.0.15.exe，便携包为 lanchat-win-x64-1.0.15.zip。
            Android 安装包为 lanchat-android-1.0.15.apk，继续使用固定发布证书以支持覆盖安装。
