name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    # pinned: windows-latest (Server 2025 image) breaks Flutter 3.35's VS
    # detection — it falls back to the VS2019 generator which doesn't exist
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Pack portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ver = python scripts/release-version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/lanchat-win-x64-$ver.zip"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python scripts/release-version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/lanchat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Older clients require this exact asset name for in-app updates.
          Copy-Item "dist/lanchat-setup-$ver.exe" dist/lanchat-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android signature verification
        run: python3 test/android_signature_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify fixed Android release signature
        run: python3 scripts/verify-android-signature.py
      - run: |
          mkdir -p dist
          ver="$(python3 scripts/release-version.py)"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/lanchat-android-$ver.apk"
          # Compatibility asset for clients that only recognize the old name.
          cp "dist/lanchat-android-$ver.apk" dist/lanchat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  build-macos:
    # Keep Flutter 3.35 compatible with the original macOS 10.15 deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - name: Check first-launch installation hint
        run: test/macos_install_hint/run.sh
      - name: Test Mac update replacement and rollback
        run: python3 test/macos_updater_test.py
      - run: flutter build macos --release
      - name: Package DMG and ZIP
        run: |
          scripts/package-macos-release.sh
          ver="$(python3 scripts/release-version.py)"
          # Compatibility asset for clients that only recognize the old name.
          cp "dist/lanchat-macos-$ver.dmg" dist/lanchat-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            优化 Windows 覆盖安装：安装器启用强制关闭占用进程的兜底；新版客户端收到安装更新退出消息时会真正退出，普通关闭窗口仍隐藏到托盘。
            安装完成仅通过“运行 LanChat”选项启动应用，避免重复拉起。

            Windows／Mac 默认只运行一个实例，再次启动会唤起已有窗口，包括托盘隐藏及最小化的窗口。
            重复进程不会初始化聊天配置、设备发现或传输端口；异常退出后可正常重新启动。
            本地测试继续使用不同的 LANCHAT_INSTANCE 或 --dart-define=INSTANCE 隔离实例，每个测试实例名只运行一份。

            继续支持图片消息右键复制图片、共享文件夹及整文件夹递归复制／上传／拖入，以及忽略指定版本的自动更新提示。
            共享文件夹默认只读，可单独允许写入或取消共享；同名文件夹自动改名，保留原内容。

            安装包及便携包文件名包含版本号，网页下载时请选择带版本号的文件。
            不带版本号的安装包为旧客户端应用内更新的兼容入口，内容相同。
            macOS 推荐下载 lanchat-macos-1.0.16.dmg，同时提供 ZIP 和 SHA256SUMS-1.0.16.txt 校验清单。
            Windows 安装包为 lanchat-setup-1.0.16.exe，便携包为 lanchat-win-x64-1.0.16.zip。
            Android 安装包为 lanchat-android-1.0.16.apk，继续使用固定发布证书以支持覆盖安装。
