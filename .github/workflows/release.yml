name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    # pinned: windows-latest (Server 2025 image) breaks Flutter 3.35's VS
    # detection — it falls back to the VS2019 generator which doesn't exist
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Pack portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/lanchat-win-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = '${{ github.ref_name }}' -replace '^v',''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer/lanchat.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android signature verification
        run: python3 test/android_signature_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify fixed Android release signature
        run: python3 scripts/verify-android-signature.py
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/lanchat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  build-macos:
    # Keep Flutter 3.35 compatible with the original macOS 10.15 deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
      - run: flutter pub get
      - name: Check first-launch installation hint
        run: test/macos_install_hint/run.sh
      - name: Test Mac update replacement and rollback
        run: python3 test/macos_updater_test.py
      - run: flutter build macos --release
      - name: Package DMG and ZIP
        run: scripts/package-macos-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            修复 Android Build Tools 37 输出格式变化导致的签名校验误报，恢复发布流程。
            保留 APK 完整性及固定发布证书校验，增加真实工具输出回归测试和失败诊断日志。

            本版新增新消息提醒、状态栏／托盘未读闪烁，点击通知或提醒可直接打开对应聊天。
            前台当前会话不重复提醒；后台消息正确计入未读，重传消息不重复通知。
            设置中可分别关闭消息提醒与图标闪烁，切换会话会保留本次运行期间的文字和代码草稿。
            修复 macOS 原生关闭路径退出应用的问题，关闭窗口后继续后台接收，并支持重新打开隐藏窗口。
            系统横幅需要通知权限，显示方式受系统通知及勿扰／共享屏幕设置控制。

            继续支持自动检查正式版本、点击下载安装、下载进度、取消及 SHA256 校验。
            窗口标题显示实际版本号；设置及桌面托盘菜单可手动检查更新。
            Android 正式包使用固定发布证书，构建和安装前均检查签名；debug 版采用独立应用 ID。
            如果手机已安装不同签名的旧版，需要先保留重要数据，再卸载旧版并重新安装一次；应用不会自动卸载旧版。
            首次升级到支持应用内更新的版本仍需手动安装，后续版本可在应用中更新。

            macOS 推荐下载 lanchat-macos.dmg，打开后把应用拖入 Applications（应用程序），再从“应用程序”启动。
            lanchat-macos.zip 继续保留；同时提供 SHA256SUMS.txt 校验文件。
            首次从下载目录或 DMG 运行时，会显示移到“应用程序”的提示。
